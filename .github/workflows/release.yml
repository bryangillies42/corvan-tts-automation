name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve and validate release profile
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/resolve-release.mjs \
            --tag "${RELEASE_TAG}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Test
        run: npm test

      - name: Discover previous stable version for the same character
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.resolve.outputs.id }}
          RELEASE_TAG_MODE: ${{ steps.resolve.outputs.tagMode }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # The GitHub API is paged explicitly so a full tenth page fails closed
          # instead of silently selecting an incomplete history.
          release_lines="$(mktemp)"
          trap 'rm -f "${release_lines}"' EXIT
          : > "${release_lines}"

          page_filled=false
          for page in $(seq 1 10); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")"
            count="$(jq 'length' <<<"${response}")"
            if ! [[ "${count}" =~ ^[0-9]+$ ]]; then
              echo "Resposta inválida ao consultar releases na página ${page}." >&2
              exit 1
            fi
            jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' <<<"${response}" >> "${release_lines}"
            if (( count < 100 )); then
              page_filled=false
              break
            fi
            page_filled=true
          done
          if [[ "${page_filled}" == "true" ]]; then
            echo "A lista de releases excede o limite seguro de 10 páginas." >&2
            exit 1
          fi

          previous_version="$(RELEASE_ID="${RELEASE_ID}" RELEASE_TAG_MODE="${RELEASE_TAG_MODE}" RELEASE_TAG="${RELEASE_TAG}" node --input-type=module - "${release_lines}" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { compareSemverVersions, versionFromReleaseTag } from './scripts/resolve-release.mjs';

          const file = process.argv[2];
          const id = process.env.RELEASE_ID;
          const tagMode = process.env.RELEASE_TAG_MODE;
          const current = process.env.RELEASE_TAG;
          const profile = {id, tagMode};
          const currentVersion = versionFromReleaseTag(profile, current);
          const values = readFileSync(file, 'utf8')
            .split(/\r?\n/)
            .map((tag) => versionFromReleaseTag(profile, tag.trim()))
            .filter((version) => version !== null
              && compareSemverVersions(version, currentVersion) < 0);
          process.stdout.write(values.sort(compareSemverVersions).at(-1) ?? '');
          NODE
          )"
          echo "version=${previous_version}" >> "${GITHUB_OUTPUT}"
          echo "Previous stable version: ${previous_version:-none}"

      - name: Build selected character artifacts
        env:
          RELEASE_ID: ${{ steps.resolve.outputs.id }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          build_args=(--character "${RELEASE_ID}" --commit "${RELEASE_COMMIT_SHA}")
          if [[ -n "${RELEASE_PREVIOUS_VERSION}" ]]; then
            build_args+=(--previous "${RELEASE_PREVIOUS_VERSION}")
          fi
          npm run build:character -- "${build_args[@]}"

      - name: Validate and stage release assets in a draft
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.resolve.outputs.id }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_TITLE: ${{ steps.resolve.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          RELEASE_RUNTIME: ${{ steps.resolve.outputs.runtime }}
          RELEASE_MANIFEST: ${{ steps.resolve.outputs.manifest }}
          RELEASE_SAVED_OBJECT: ${{ steps.resolve.outputs.savedObject }}
          RELEASE_RUNTIME_PATH: ${{ steps.resolve.outputs.runtimePath }}
          RELEASE_MANIFEST_PATH: ${{ steps.resolve.outputs.manifestPath }}
          RELEASE_SAVED_OBJECT_PATH: ${{ steps.resolve.outputs.savedObjectPath }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_asset() {
            local expected="$1"
            if [[ -f "${expected}" ]]; then
              printf '%s' "${expected}"
            else
              echo "Artefato ausente: ${expected}" >&2
              exit 1
            fi
          }

          runtime_path="$(resolve_asset "${RELEASE_RUNTIME_PATH}" "${RELEASE_RUNTIME}")"
          manifest_path="$(resolve_asset "${RELEASE_MANIFEST_PATH}" "${RELEASE_MANIFEST}")"
          saved_object_path="$(resolve_asset "${RELEASE_SAVED_OBJECT_PATH}" "${RELEASE_SAVED_OBJECT}")"
          echo "runtime_path=${runtime_path}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"
          echo "saved_object_path=${saved_object_path}" >> "${GITHUB_OUTPUT}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_json="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease,tagName)"
            is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"${release_json}")"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${RELEASE_TAG} já está publicada e é imutável; não será substituída." >&2
              exit 1
            fi
            if [[ "${is_prerelease}" != "${RELEASE_PRERELEASE}" ]]; then
              echo "A draft ${RELEASE_TAG} possui canal incompatível." >&2
              exit 1
            fi
          else
            create_args=(
              "${RELEASE_TAG}"
              --verify-tag
              --generate-notes
              --title "${RELEASE_TITLE}"
              --draft
              --latest=false
            )
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          gh release upload "${RELEASE_TAG}" \
            "${runtime_path}" \
            "${manifest_path}" \
            "${saved_object_path}" \
            --clobber

      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.resolve.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease --latest=false
          elif [[ "${RELEASE_LATEST}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --latest
          else
            gh release edit "${RELEASE_TAG}" --draft=false --latest=false
          fi

      - name: Verify immutable release and global Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.resolve.outputs.id }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_TAG_MODE: ${{ steps.resolve.outputs.tagMode }}
          RELEASE_RUNTIME_MARKER: ${{ steps.resolve.outputs.runtimeMarker }}
          RELEASE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          RELEASE_LATEST: ${{ steps.resolve.outputs.latest }}
          RELEASE_RUNTIME: ${{ steps.resolve.outputs.runtime }}
          RELEASE_MANIFEST: ${{ steps.resolve.outputs.manifest }}
          RELEASE_SAVED_OBJECT: ${{ steps.resolve.outputs.savedObject }}
          RELEASE_RUNTIME_PATH: ${{ steps.stage.outputs.runtime_path }}
          RELEASE_MANIFEST_PATH: ${{ steps.stage.outputs.manifest_path }}
          RELEASE_SAVED_OBJECT_PATH: ${{ steps.stage.outputs.saved_object_path }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease,tagName,assets)"
          jq -e --arg tag "${RELEASE_TAG}" --argjson prerelease "${RELEASE_PRERELEASE}" \
            '.isDraft == false and .tagName == $tag and .isPrerelease == $prerelease' \
            <<<"${release_json}" >/dev/null
          for asset in "${RELEASE_RUNTIME}" "${RELEASE_MANIFEST}" "${RELEASE_SAVED_OBJECT}"; do
            jq -e --arg name "${asset}" '.assets | any(.name == $name)' <<<"${release_json}" >/dev/null
          done
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "${verify_dir}"' EXIT
          gh release download "${RELEASE_TAG}" --dir "${verify_dir}" \
            --pattern "${RELEASE_RUNTIME}" \
            --pattern "${RELEASE_MANIFEST}" \
            --pattern "${RELEASE_SAVED_OBJECT}"
          test -f "${RELEASE_RUNTIME_PATH}"
          test -f "${RELEASE_MANIFEST_PATH}"
          test -f "${RELEASE_SAVED_OBJECT_PATH}"
          cmp --silent "${RELEASE_RUNTIME_PATH}" "${verify_dir}/${RELEASE_RUNTIME}"
          cmp --silent "${RELEASE_MANIFEST_PATH}" "${verify_dir}/${RELEASE_MANIFEST}"
          cmp --silent "${RELEASE_SAVED_OBJECT_PATH}" "${verify_dir}/${RELEASE_SAVED_OBJECT}"
          grep -Fq -- "${RELEASE_RUNTIME_MARKER}" "${verify_dir}/${RELEASE_RUNTIME}"
          jq -e \
            --arg id "${RELEASE_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --arg version "${RELEASE_VERSION}" \
            '.schemaVersion == 1 and .characterId == $id and .releaseTag == $tag and .version == $version' \
            "${verify_dir}/${RELEASE_MANIFEST}" >/dev/null

          latest_tag="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          legacy_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "${RELEASE_LATEST}" == "true" ]]; then
            if [[ "${latest_tag}" != "${RELEASE_TAG}" ]]; then
              echo "Latest global esperado em ${RELEASE_TAG}, encontrado ${latest_tag}." >&2
              exit 1
            fi
          elif [[ ! "${latest_tag}" =~ ${legacy_pattern} ]]; then
            echo "Latest global ${latest_tag} não é uma release legacy do Corvan." >&2
            exit 1
          elif [[ "${RELEASE_TAG_MODE}" == "namespaced" && "${latest_tag}" == "${RELEASE_TAG}" ]]; then
            echo "Uma release namespaced não pode assumir Latest global." >&2
            exit 1
          fi
          echo "Release ${RELEASE_TAG} verificada; Latest global: ${latest_tag}."
